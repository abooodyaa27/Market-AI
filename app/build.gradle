plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketai.standalone'
    compileSdk 35

    defaultConfig {
        applicationId "com.marketai.scalp"
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName "3.0.5"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
