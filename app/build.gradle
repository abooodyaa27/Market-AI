plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketai.standalone'
    compileSdk 35

    defaultConfig {
        applicationId "com.marketai.standalone"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
