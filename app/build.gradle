plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketai.standalone'
    compileSdk 35

    defaultConfig {
        applicationId "com.marketai.standalone"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
